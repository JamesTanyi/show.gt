<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>幕启 · 演出管理系统</title>
<style>
/* ---- Local fonts via app:// protocol (served by main process, no CDN) ---- */
@import url('app://app/node_modules/@fontsource/ma-shan-zheng/index.css');
@import url('app://app/node_modules/@fontsource/fraunces/400.css');
@import url('app://app/node_modules/@fontsource/fraunces/600.css');
@import url('app://app/node_modules/@fontsource/fraunces/700.css');

:root{
  --bg:#0E0B10;
  --bg-2:#161119;
  --surface:#1D1620;
  --surface-2:#241C29;
  --burgundy:#7A1F3D;
  --burgundy-light:#9C2F52;
  --gold:#C9A227;
  --gold-light:#E4C55A;
  --cream:#EDE3D0;
  --muted:#8A7F8C;
  --line: rgba(201,162,39,0.16);
  --font-display:'Fraunces','Noto Serif SC','SimSun',serif;
  --font-body:'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'JetBrains Mono','Consolas','Courier New',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--cream);font-family:var(--font-body);overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--gold);color:#1a1420;}

#app{position:relative;width:100%;height:100vh;}
.screen{position:absolute;inset:0;}
.hidden{display:none !important;}

/* ---- Welcome ---- */
.welcome{background:radial-gradient(ellipse at 50% 30%, #241627 0%, #0E0B10 65%);display:flex;align-items:center;justify-content:center;}
.curtain{position:absolute;top:0;bottom:0;width:52%;background:
    linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0) 12%),
    repeating-linear-gradient(90deg, var(--burgundy) 0 22px, var(--burgundy-light) 22px 40px);
  box-shadow: inset -40px 0 60px -20px rgba(0,0,0,0.6);
  transition: transform 1.1s cubic-bezier(.77,0,.18,1);
  z-index:1;
}
.curtain::after{content:'';position:absolute;left:0;right:0;bottom:0;height:26px;
  background: repeating-linear-gradient(90deg, transparent 0 14px, var(--gold) 14px 16px);
  opacity:.55;
}
.curtain-left{left:0;transform-origin:left;}
.curtain-right{right:0;transform-origin:right;}
.curtain-left.open{transform:translateX(-102%);}
.curtain-right.open{transform:translateX(102%);}

.welcome-content{position:relative;z-index:10;text-align:center;padding:40px;width:100%;max-width:1400px;}
.title-arc{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 24px rgba(0,0,0,.5));}
.arc-text{font-family:'Ma Shan Zheng','Noto Serif SC',cursive;font-size:210px;fill:var(--gold-light);}
.welcome-sub{margin-top:-30px;color:var(--cream);opacity:.85;}
.welcome-sub p{margin:6px 0;font-size:17px;letter-spacing:.22em;font-family:var(--font-body);}

#welcomeHint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.2em;
  opacity:0;transition:opacity .5s;pointer-events:none;z-index:20;}

/* ---- Console ---- */
.console{background:var(--bg);display:none;flex-direction:column;height:100vh;}
.console.active{display:flex;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--bg-2);flex:0 0 auto;}
.topbar .brand{display:flex;align-items:baseline;gap:12px;}
.topbar .brand h1{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;letter-spacing:.02em;}
.topbar .brand span{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.12em;}
.topbar-actions{display:flex;gap:10px;}
.icon-btn{background:var(--surface);border:1px solid var(--line);color:var(--cream);padding:9px 16px;border-radius:3px;font-size:13px;display:flex;align-items:center;gap:8px;letter-spacing:.03em;transition:.2s;}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-light);}

.main-grid{flex:1 1 auto;display:grid;grid-template-columns:360px 1fr;min-height:0;}

/* ---- Sidebar ---- */
.sidebar{border-right:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;min-height:0;}
.sidebar-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);}
.sidebar-head h2{font-family:var(--font-display);font-size:16px;margin:0 0 4px;font-weight:600;}
.sidebar-head p{margin:0;font-size:12px;color:var(--muted);}
.program-list{flex:1;overflow-y:auto;padding:10px 12px;}
.program-item{display:flex;gap:12px;padding:12px 12px;border-radius:4px;border:1px solid transparent;margin-bottom:6px;cursor:pointer;transition:.15s;position:relative;}
.program-item:hover{background:var(--surface);}
.program-item.current{background:var(--surface-2);border-color:var(--gold);}
.program-num{font-family:var(--font-mono);font-size:12px;color:var(--gold);min-width:22px;padding-top:2px;}
.program-info{flex:1;min-width:0;}
.program-info .pname{font-size:14px;font-weight:600;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.program-info .pperformer{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.program-meta{display:flex;gap:6px;margin-top:6px;}
.tag{font-size:10px;font-family:var(--font-mono);padding:2px 6px;border-radius:2px;border:1px solid var(--line);color:var(--muted);}
.tag.on{color:var(--gold-light);border-color:var(--gold);}
.item-actions{display:flex;flex-direction:column;gap:4px;opacity:0;transition:.15s;}
.program-item:hover .item-actions{opacity:1;}
.mini-btn{background:none;border:none;color:var(--muted);font-size:13px;padding:2px 4px;line-height:1;}
.mini-btn:hover{color:var(--gold-light);}

.sidebar-foot{padding:14px 16px;border-top:1px solid var(--line);}
.btn-add{width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);padding:11px;border-radius:4px;font-size:13px;letter-spacing:.04em;}
.btn-add:hover{border-color:var(--gold);color:var(--gold-light);}

/* ---- Editor drawer ---- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:center;justify-content:center;}
.drawer-backdrop.active{display:flex;}
.drawer{width:420px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px;max-height:88vh;overflow-y:auto;}
.drawer h3{font-family:var(--font-display);font-size:18px;margin:0 0 18px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--muted);letter-spacing:.05em;margin-bottom:6px;}
.field input[type=text]{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--cream);padding:10px 12px;border-radius:3px;font-size:14px;}
.field input[type=text]:focus{outline:none;border-color:var(--gold);}
.colorset{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch.sel{border-color:var(--gold-light);}
.filerow{display:flex;align-items:center;gap:10px;}
.filerow label.filebtn{background:var(--bg-2);border:1px solid var(--line);padding:9px 14px;border-radius:3px;font-size:12px;color:var(--cream);cursor:pointer;}
.filerow label.filebtn:hover{border-color:var(--gold);}
.filerow input[type=file]{display:none;}
.filename{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.drawer-actions{display:flex;justify-content:space-between;margin-top:22px;gap:10px;}
.btn-danger{background:none;border:1px solid rgba(220,90,90,.4);color:#e08080;padding:9px 16px;border-radius:3px;font-size:13px;}
.btn-danger:hover{background:rgba(220,90,90,.12);}
.btn-primary{background:var(--gold);border:1px solid var(--gold);color:#1a1420;padding:9px 20px;border-radius:3px;font-size:13px;font-weight:600;letter-spacing:.03em;}
.btn-primary:hover{background:var(--gold-light);}

/* ---- Stage ---- */
.stage-wrap{position:relative;display:flex;flex-direction:column;min-height:0;background:#000;}
.stage{flex:1;position:relative;background-size:cover;background-position:center;display:flex;align-items:flex-end;}
.stage::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%);}
.stage-frame{position:absolute;inset:14px;border:1px solid rgba(201,162,39,.35);pointer-events:none;}
.stage-frame::before,.stage-frame::after{content:'';position:absolute;width:22px;height:22px;border:1px solid var(--gold);}
.stage-frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
.stage-frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
.stage-info{position:relative;z-index:2;padding:34px 40px;width:100%;}
.stage-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.24em;color:var(--gold-light);text-transform:uppercase;margin-bottom:10px;}
.stage-title{font-family:var(--font-display);font-size:clamp(28px,4vw,52px);font-weight:700;margin:0 0 8px;}
.stage-performer{font-size:15px;color:var(--muted);letter-spacing:.03em;}
.empty-stage{position:relative;z-index:2;margin:auto;text-align:center;color:var(--muted);}
.empty-stage p{font-family:var(--font-display);font-size:20px;}

/* Keyboard shortcut hint in present mode */
.present-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.25);letter-spacing:.15em;
  z-index:5;pointer-events:none;}

/* ---- Player ---- */
.player{flex:0 0 auto;background:var(--bg-2);border-top:1px solid var(--line);padding:14px 30px 20px;}
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.time{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:44px;}
.time.end{text-align:right;}
input[type=range]{-webkit-appearance:none;appearance:none;height:3px;background:var(--line);border-radius:2px;flex:1;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 0 3px rgba(201,162,39,.15);}
.controls-row{display:flex;align-items:center;justify-content:space-between;}
.transport{display:flex;align-items:center;gap:18px;}
.transport button{background:none;border:none;color:var(--cream);font-size:18px;padding:6px;}
.transport button:hover{color:var(--gold-light);}
.play-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold) !important;display:flex;align-items:center;justify-content:center;font-size:16px !important;}
.play-btn:hover{background:var(--gold);color:#1a1420 !important;}
.volume-row{display:flex;align-items:center;gap:8px;width:150px;}
.volume-row input[type=range]{flex:1;}
.vol-icon{font-size:14px;color:var(--muted);}
.no-audio-hint{font-size:11px;color:var(--muted);font-family:var(--font-mono);}

/* ---- Presentation mode ---- */
.console.present .sidebar,
.console.present .topbar,
.console.present .player{display:none;}
.console.present .main-grid{grid-template-columns:1fr;}
.console.present .stage-info{padding:60px;}
.exit-present{position:fixed;top:22px;right:26px;z-index:50;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--cream);padding:8px 14px;border-radius:3px;font-size:12px;display:none;}
.console.present .exit-present{display:block;}

/* ---- Settings modal ---- */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;}
.modal-backdrop.active{display:flex;}
.modal{width:480px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px;max-height:90vh;overflow-y:auto;}
.modal h3{font-family:var(--font-display);font-size:18px;margin:0 0 20px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}

/* ---- Confirm modal ---- */
.confirm-modal{width:360px;}
.confirm-modal p{color:var(--cream);font-size:14px;line-height:1.6;margin:0 0 20px;}

/* ---- Toast notifications ---- */
#toastContainer{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:var(--surface-2);border:1px solid var(--line);color:var(--cream);padding:10px 20px;border-radius:4px;font-size:13px;font-family:var(--font-mono);letter-spacing:.03em;opacity:0;transform:translateY(10px);transition:.3s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.toast-error{border-color:rgba(220,90,90,.5);color:#e08080;}
.toast.toast-warn{border-color:rgba(201,162,39,.5);color:var(--gold-light);}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px;}
</style>
</head>
<body>
<div id="app">

  <!-- ======= WELCOME ======= -->
  <div class="screen welcome" id="welcome">
    <div class="curtain curtain-left" id="curtainLeft"></div>
    <div class="curtain curtain-right" id="curtainRight"></div>
    <div class="welcome-content">
      <svg class="title-arc" viewBox="0 0 2000 1000" preserveAspectRatio="xMidYMid meet">
        <defs>
          <path id="arcPath" d="M 100 780 Q 1000 180 1900 780" fill="none"/>
        </defs>
        <text class="arc-text">
          <textPath href="#arcPath" startOffset="50%" text-anchor="middle" id="arcText">演出管理系统</textPath>
        </text>
      </svg>
      <div class="welcome-sub">
        <p id="orgLine1"></p>
        <p id="orgLine2"></p>
      </div>
    </div>
    <div id="welcomeHint">双击进入控制台</div>
  </div>

  <!-- ======= CONSOLE ======= -->
  <div class="screen console" id="console">
    <button class="exit-present" id="exitPresent">退出放映 ⎋</button>

    <div class="topbar">
      <div class="brand">
        <h1>幕启 · 控制台</h1>
        <span id="progIndex">节目 00 / 00</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="rescanBtn" title="从文件夹批量导入节目">📁 选择文件夹</button>
        <button class="icon-btn" id="exportBtn" title="导出节目单 JSON">⬇ 导出</button>
        <button class="icon-btn" id="importBtn" title="导入节目单 JSON">⬆ 导入</button>
        <button class="icon-btn" id="settingsBtn" title="演出设置">⚙ 设置</button>
        <button class="icon-btn" id="presentBtn" title="进入放映模式">▣ 放映</button>
      </div>
    </div>

    <div class="main-grid">
      <div class="sidebar">
        <div class="sidebar-head">
          <h2>节目单</h2>
          <p id="countHint">共 0 个节目</p>
        </div>
        <div class="program-list" id="programList"></div>
        <div class="sidebar-foot">
          <button class="btn-add" id="addBtn">＋ 新增节目</button>
        </div>
      </div>

      <div class="stage-wrap">
        <div class="stage" id="stage">
          <div class="stage-frame"></div>
          <div class="empty-stage" id="emptyStage">
            <p>暂无节目 · 请在左侧新增</p>
          </div>
          <div class="stage-info hidden" id="stageInfo">
            <div class="stage-eyebrow" id="stageOrder">第 01 场</div>
            <h2 class="stage-title" id="stageName">节目名称</h2>
            <div class="stage-performer" id="stagePerformer">表演者</div>
          </div>
          <div class="present-hint" id="presentHint">← → 切换节目 · 空格 播放/暂停 · Esc 退出放映</div>
        </div>

        <div class="player">
          <div class="progress-row">
            <span class="time" id="curTime">00:00</span>
            <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
            <span class="time end" id="durTime">00:00</span>
          </div>
          <div class="controls-row">
            <div class="transport">
              <button id="prevBtn" title="上一个 (←)">⏮</button>
              <button id="playBtn" class="play-btn" title="播放/暂停 (空格)">▶</button>
              <button id="nextBtn" title="下一个 (→)">⏭</button>
            </div>
            <div class="volume-row">
              <span class="vol-icon">♪</span>
              <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
            </div>
            <span class="no-audio-hint" id="audioHint">未设置音乐</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ======= EDITOR DRAWER ======= -->
  <div class="drawer-backdrop" id="drawerBackdrop">
    <div class="drawer">
      <h3 id="drawerTitle">新增节目</h3>
      <div class="field">
        <label>节目名称</label>
        <input type="text" id="fName" placeholder="例如：开场舞《盛世欢歌》">
      </div>
      <div class="field">
        <label>表演者 / 单位</label>
        <input type="text" id="fPerformer" placeholder="例如：舞蹈队">
      </div>
      <div class="field">
        <label>背景颜色</label>
        <div class="colorset" id="colorSet"></div>
      </div>
      <div class="field">
        <label>背景图片（可选）</label>
        <div class="filerow">
          <label class="filebtn">选择图片<input type="file" id="fImage" accept="image/*"></label>
          <span class="filename" id="imageName">未选择</span>
        </div>
      </div>
      <div class="field">
        <label>节目音乐（可选）</label>
        <div class="filerow">
          <label class="filebtn">选择音频<input type="file" id="fAudio" accept="audio/*"></label>
          <span class="filename" id="audioName">未选择</span>
        </div>
      </div>
      <div class="drawer-actions">
        <button class="btn-danger" id="deleteBtn">删除节目</button>
        <div style="display:flex;gap:10px;">
          <button class="icon-btn" id="cancelBtn">取消</button>
          <button class="btn-primary" id="saveBtn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ======= SETTINGS MODAL ======= -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h3>演出设置</h3>
      <div class="field">
        <label>演出标题（欢迎页弧形大字）</label>
        <input type="text" id="settingTitle" placeholder="例如：XXX医院慰问演出">
      </div>
      <div class="field">
        <label>主办方第一行</label>
        <input type="text" id="settingOrg1" placeholder="例如：主办单位：XXX">
      </div>
      <div class="field">
        <label>主办方第二行</label>
        <input type="text" id="settingOrg2" placeholder="（可留空）">
      </div>
      <div class="field">
        <label>开幕背景音乐</label>
        <div class="filerow">
          <label class="filebtn">选择音频<input type="file" id="settingWelcomeMusic" accept="audio/*"></label>
          <span class="filename" id="settingWelcomeMusicName">未设置</span>
        </div>
      </div>
      <div class="modal-actions">
        <button class="icon-btn" id="settingsCancelBtn">取消</button>
        <button class="btn-primary" id="settingsSaveBtn">保存设置</button>
      </div>
    </div>
  </div>

  <!-- ======= CONFIRM MODAL ======= -->
  <div class="modal-backdrop" id="confirmModal">
    <div class="modal confirm-modal">
      <h3>确认操作</h3>
      <p id="confirmMsg"></p>
      <div class="modal-actions">
        <button class="icon-btn" id="confirmCancelBtn">取消</button>
        <button class="btn-danger" id="confirmOkBtn">确定</button>
      </div>
    </div>
  </div>

</div>

<audio id="audioEl" preload="metadata"></audio>
<audio id="welcomeMusic" preload="auto" loop></audio>
<div id="toastContainer"></div>

<script>
(async function () {
  'use strict';

  const PALETTE = ['#7A1F3D', '#1F3D4A', '#3D2F1F', '#1F4A2E', '#4A1F3D', '#2A2438'];

  let programs = [];
  let currentId = null;
  let editingId = null;
  let pendingImagePath = null, pendingImageName = '';
  let pendingAudioPath = null, pendingAudioName = '';
  let pendingColor = PALETTE[0];
  let currentSettings = {};
  let pendingWelcomeMusicPath = null;

  function cid() { return 'p_' + Math.random().toString(36).slice(2, 9); }

  // ---- Element refs ----
  const welcome        = document.getElementById('welcome');
  const consoleEl      = document.getElementById('console');
  const curtainLeft    = document.getElementById('curtainLeft');
  const curtainRight   = document.getElementById('curtainRight');
  const welcomeMusic   = document.getElementById('welcomeMusic');
  const arcTextEl      = document.getElementById('arcText');
  const orgLine1El     = document.getElementById('orgLine1');
  const orgLine2El     = document.getElementById('orgLine2');
  const welcomeHint    = document.getElementById('welcomeHint');

  const programList    = document.getElementById('programList');
  const countHint      = document.getElementById('countHint');
  const progIndex      = document.getElementById('progIndex');
  const addBtn         = document.getElementById('addBtn');
  const rescanBtn      = document.getElementById('rescanBtn');
  const exportBtn      = document.getElementById('exportBtn');
  const importBtn      = document.getElementById('importBtn');
  const presentBtn     = document.getElementById('presentBtn');
  const settingsBtn    = document.getElementById('settingsBtn');
  const exitPresent    = document.getElementById('exitPresent');

  const stage          = document.getElementById('stage');
  const emptyStage     = document.getElementById('emptyStage');
  const stageInfo      = document.getElementById('stageInfo');
  const stageOrder     = document.getElementById('stageOrder');
  const stageName      = document.getElementById('stageName');
  const stagePerformer = document.getElementById('stagePerformer');

  const audioEl        = document.getElementById('audioEl');
  const playBtn        = document.getElementById('playBtn');
  const prevBtn        = document.getElementById('prevBtn');
  const nextBtn        = document.getElementById('nextBtn');
  const seek           = document.getElementById('seek');
  const curTime        = document.getElementById('curTime');
  const durTime        = document.getElementById('durTime');
  const volume         = document.getElementById('volume');
  const audioHint      = document.getElementById('audioHint');

  const drawerBackdrop = document.getElementById('drawerBackdrop');
  const drawerTitle    = document.getElementById('drawerTitle');
  const fName          = document.getElementById('fName');
  const fPerformer     = document.getElementById('fPerformer');
  const colorSet       = document.getElementById('colorSet');
  const fImage         = document.getElementById('fImage');
  const imageName      = document.getElementById('imageName');
  const fAudio         = document.getElementById('fAudio');
  const audioNameEl    = document.getElementById('audioName');
  const saveBtn        = document.getElementById('saveBtn');
  const cancelBtn      = document.getElementById('cancelBtn');
  const deleteBtn      = document.getElementById('deleteBtn');

  const settingsModal           = document.getElementById('settingsModal');
  const settingTitle            = document.getElementById('settingTitle');
  const settingOrg1             = document.getElementById('settingOrg1');
  const settingOrg2             = document.getElementById('settingOrg2');
  const settingWelcomeMusic     = document.getElementById('settingWelcomeMusic');
  const settingWelcomeMusicName = document.getElementById('settingWelcomeMusicName');
  const settingsSaveBtn         = document.getElementById('settingsSaveBtn');
  const settingsCancelBtn       = document.getElementById('settingsCancelBtn');

  const confirmModal      = document.getElementById('confirmModal');
  const confirmMsg        = document.getElementById('confirmMsg');
  const confirmOkBtn      = document.getElementById('confirmOkBtn');
  const confirmCancelBtn  = document.getElementById('confirmCancelBtn');
  let confirmResolve = null;

  const toastContainer = document.getElementById('toastContainer');

  // ---- Toast ----
  function showToast(msg, type = 'info') {
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    toastContainer.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => {
      t.classList.remove('show');
      setTimeout(() => t.remove(), 350);
    }, 3000);
  }

  // ---- Confirm dialog ----
  function showConfirm(msg) {
    return new Promise(resolve => {
      confirmMsg.textContent = msg;
      confirmResolve = resolve;
      confirmModal.classList.add('active');
    });
  }
  confirmOkBtn.addEventListener('click', () => {
    confirmModal.classList.remove('active');
    confirmResolve && confirmResolve(true);
  });
  confirmCancelBtn.addEventListener('click', () => {
    confirmModal.classList.remove('active');
    confirmResolve && confirmResolve(false);
  });

  // ---- Data persistence ----
  async function persistData() {
    await window.api.saveData({ programs });
  }

  // ---- Settings ----
  function applySettings(s) {
    currentSettings = s;
    arcTextEl.textContent = s.showTitle || '演出管理系统';
    orgLine1El.textContent = s.organizerLine1 || '';
    orgLine2El.textContent = s.organizerLine2 || '';
    if (s.welcomeMusic) {
      welcomeMusic.src = window.api.toUrl(s.welcomeMusic);
    } else {
      welcomeMusic.src = '';
    }
  }

  settingsBtn.addEventListener('click', () => {
    settingTitle.value = currentSettings.showTitle || '';
    settingOrg1.value  = currentSettings.organizerLine1 || '';
    settingOrg2.value  = currentSettings.organizerLine2 || '';
    settingWelcomeMusicName.textContent = currentSettings.welcomeMusic ? '已设置' : '未设置';
    pendingWelcomeMusicPath = null;
    settingsModal.classList.add('active');
  });

  settingWelcomeMusic.addEventListener('change', async () => {
    const file = settingWelcomeMusic.files[0];
    if (!file) return;
    settingWelcomeMusicName.textContent = '复制中…';
    const result = await window.api.copyMedia(file.path);
    if (result.ok) {
      pendingWelcomeMusicPath = result.path;
      settingWelcomeMusicName.textContent = file.name;
    } else {
      settingWelcomeMusicName.textContent = '复制失败';
      showToast('音乐文件复制失败', 'error');
    }
    settingWelcomeMusic.value = '';
  });

  settingsSaveBtn.addEventListener('click', async () => {
    const newSettings = {
      showTitle:       settingTitle.value.trim() || '演出管理系统',
      organizerLine1:  settingOrg1.value.trim(),
      organizerLine2:  settingOrg2.value.trim(),
      welcomeMusic:    pendingWelcomeMusicPath || currentSettings.welcomeMusic || ''
    };
    await window.api.saveSettings(newSettings);
    applySettings(newSettings);
    settingsModal.classList.remove('active');
    showToast('设置已保存');
  });
  settingsCancelBtn.addEventListener('click', () => settingsModal.classList.remove('active'));

  // ---- Welcome screen ----
  let hintTimeout;
  welcome.addEventListener('click', () => {
    welcomeHint.style.opacity = '1';
    clearTimeout(hintTimeout);
    hintTimeout = setTimeout(() => { welcomeHint.style.opacity = '0'; }, 2500);
  });

  welcome.addEventListener('dblclick', enterConsole);

  function enterConsole() {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    welcomeMusic.pause();
    curtainLeft.classList.add('open');
    curtainRight.classList.add('open');
    setTimeout(() => {
      welcome.classList.add('hidden');
      consoleEl.classList.add('active');
      renderList();
      loadCurrent();
    }, 950);
  }

  // ---- Program list rendering ----
  function renderList() {
    programList.innerHTML = '';
    countHint.textContent = `共 ${programs.length} 个节目`;
    const curIdx = programs.findIndex(p => p.id === currentId);
    progIndex.textContent = `节目 ${programs.length ? String(curIdx + 1).padStart(2, '0') : '00'} / ${String(programs.length).padStart(2, '0')}`;

    programs.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'program-item' + (p.id === currentId ? ' current' : '');
      row.innerHTML = `
        <div class="program-num">${String(idx + 1).padStart(2, '0')}</div>
        <div class="program-info">
          <div class="pname">${escapeHtml(p.name || '未命名节目')}</div>
          <div class="pperformer">${escapeHtml(p.performer || '—')}</div>
          <div class="program-meta">
            <span class="tag ${p.bgImagePath ? 'on' : ''}">背景${p.bgImagePath ? '✓' : ''}</span>
            <span class="tag ${p.audioPath ? 'on' : ''}">音乐${p.audioPath ? '✓' : ''}</span>
          </div>
        </div>
        <div class="item-actions">
          <button class="mini-btn" data-act="up" title="上移">↑</button>
          <button class="mini-btn" data-act="down" title="下移">↓</button>
          <button class="mini-btn" data-act="edit" title="编辑">✎</button>
        </div>
      `;
      row.addEventListener('click', (e) => {
        if (e.target.closest('.item-actions')) return;
        currentId = p.id;
        loadCurrent();
      });
      row.querySelector('[data-act="up"]').addEventListener('click', (e)   => { e.stopPropagation(); move(idx, -1); });
      row.querySelector('[data-act="down"]').addEventListener('click', (e) => { e.stopPropagation(); move(idx, 1); });
      row.querySelector('[data-act="edit"]').addEventListener('click', (e) => { e.stopPropagation(); openEditor(p.id); });
      programList.appendChild(row);
    });
  }

  async function move(idx, dir) {
    const j = idx + dir;
    if (j < 0 || j >= programs.length) return;
    [programs[idx], programs[j]] = [programs[j], programs[idx]];
    await persistData();
    renderList();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }

  // ---- Stage display ----
  function loadCurrent() {
    audioEl.pause();
    // Reset time display on every track change
    seek.value = 0;
    seek.max = 100;
    curTime.textContent = '00:00';
    durTime.textContent = '00:00';
    playBtn.textContent = '▶';

    const p = programs.find(x => x.id === currentId);
    if (!p) {
      emptyStage.classList.remove('hidden');
      stageInfo.classList.add('hidden');
      stage.style.backgroundImage = '';
      stage.style.backgroundColor = 'var(--bg-2)';
      audioEl.removeAttribute('src');
      audioHint.textContent = '未设置音乐';
      renderList();
      return;
    }

    emptyStage.classList.add('hidden');
    stageInfo.classList.remove('hidden');
    const idx = programs.findIndex(x => x.id === p.id);
    stageOrder.textContent = `第 ${String(idx + 1).padStart(2, '0')} 场`;
    stageName.textContent = p.name || '未命名节目';
    stagePerformer.textContent = p.performer || '';

    if (p.bgImagePath) {
      const safeUrl = window.api.toUrl(p.bgImagePath);
      stage.style.backgroundImage = `url("${safeUrl}")`;
      stage.style.backgroundColor = 'transparent';
    } else {
      stage.style.backgroundImage = '';
      stage.style.backgroundColor = p.bgColor || PALETTE[0];
    }

    if (p.audioPath) {
      audioEl.src = window.api.toUrl(p.audioPath);
      audioHint.textContent = p.audioName || '已加载音乐';
    } else {
      audioEl.removeAttribute('src');
      audioHint.textContent = '未设置音乐';
    }
    renderList();
  }

  // ---- Audio player ----
  playBtn.addEventListener('click', () => {
    if (!audioEl.getAttribute('src')) return;
    audioEl.paused ? audioEl.play().catch(() => {}) : audioEl.pause();
  });
  audioEl.addEventListener('play',  () => { playBtn.textContent = '❚❚'; });
  audioEl.addEventListener('pause', () => { playBtn.textContent = '▶'; });
  audioEl.addEventListener('loadedmetadata', () => {
    seek.max = audioEl.duration || 0;
    durTime.textContent = fmtTime(audioEl.duration);
  });

  let isSeeking = false;
  audioEl.addEventListener('timeupdate', () => {
    if (!isSeeking) seek.value = audioEl.currentTime;
    curTime.textContent = fmtTime(audioEl.currentTime);
  });
  audioEl.addEventListener('ended', () => {
    const idx = programs.findIndex(p => p.id === currentId);
    if (idx >= 0 && idx < programs.length - 1) {
      currentId = programs[idx + 1].id;
      loadCurrent();
      // Auto-play the next track
      setTimeout(() => {
        if (audioEl.getAttribute('src')) audioEl.play().catch(() => {});
      }, 150);
    }
  });
  seek.addEventListener('input',  () => { isSeeking = true;  curTime.textContent = fmtTime(+seek.value); });
  seek.addEventListener('change', () => { audioEl.currentTime = +seek.value; isSeeking = false; });
  volume.addEventListener('input', () => { audioEl.volume = +volume.value; });
  audioEl.volume = +volume.value;

  function fmtTime(s) {
    s = Math.max(0, Math.floor(s || 0));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }

  function stepProgram(dir) {
    const idx = programs.findIndex(p => p.id === currentId);
    const j = idx + dir;
    if (j < 0 || j >= programs.length) return;
    currentId = programs[j].id;
    loadCurrent();
  }
  prevBtn.addEventListener('click', () => stepProgram(-1));
  nextBtn.addEventListener('click', () => stepProgram(1));

  // ---- Keyboard shortcuts ----
  document.addEventListener('keydown', (e) => {
    const inModal = drawerBackdrop.classList.contains('active')
      || settingsModal.classList.contains('active')
      || confirmModal.classList.contains('active');

    // Allow Escape through even in modals
    if (inModal && e.key !== 'Escape') return;

    // Don't intercept when typing in a text field
    if (!inModal && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

    switch (e.key) {
      case ' ':
        e.preventDefault();
        if (audioEl.getAttribute('src')) {
          audioEl.paused ? audioEl.play().catch(() => {}) : audioEl.pause();
        }
        break;
      case 'ArrowRight':
      case 'ArrowDown':
        e.preventDefault();
        stepProgram(1);
        break;
      case 'ArrowLeft':
      case 'ArrowUp':
        e.preventDefault();
        stepProgram(-1);
        break;
      case 'Escape':
        if (drawerBackdrop.classList.contains('active'))  { drawerBackdrop.classList.remove('active'); break; }
        if (settingsModal.classList.contains('active'))   { settingsModal.classList.remove('active');  break; }
        if (confirmModal.classList.contains('active'))    { confirmModal.classList.remove('active'); confirmResolve && confirmResolve(false); break; }
        if (consoleEl.classList.contains('present'))      { leavePresent(); break; }
        break;
    }
  });

  // ---- Fullscreen sync ----
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && consoleEl.classList.contains('present')) {
      consoleEl.classList.remove('present');
    }
  });

  // ---- Presentation mode ----
  presentBtn.addEventListener('click', () => {
    consoleEl.classList.add('present');
    if (consoleEl.requestFullscreen) consoleEl.requestFullscreen().catch(() => {});
  });
  function leavePresent() {
    consoleEl.classList.remove('present');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }
  exitPresent.addEventListener('click', leavePresent);

  // ---- Folder scan ----
  rescanBtn.addEventListener('click', async () => {
    if (programs.length > 0) {
      const ok = await showConfirm('这将替换当前所有节目，确定继续？');
      if (!ok) return;
    }
    const folderPath = await window.api.openFolder();
    if (!folderPath) return;
    showToast('正在扫描并复制媒体文件…', 'info');
    const result = await window.api.scanFolder(folderPath);
    if (!result.ok) { showToast('扫描失败：' + result.error, 'error'); return; }
    if (!result.programs.length) { showToast('未在该文件夹中找到节目子文件夹', 'warn'); return; }
    programs = result.programs;
    currentId = programs[0].id;
    await persistData();
    loadCurrent();
    showToast(`已从文件夹加载 ${programs.length} 个节目`);
  });

  // ---- Export / Import ----
  exportBtn.addEventListener('click', async () => {
    const ok = await window.api.exportData({
      programs,
      exportedAt: new Date().toISOString(),
      note: '媒体文件路径为本机绝对路径，仅供本机恢复使用'
    });
    if (ok) showToast('节目单已导出');
  });

  importBtn.addEventListener('click', async () => {
    if (programs.length > 0) {
      const ok = await showConfirm('导入将替换当前所有节目，确定继续？');
      if (!ok) return;
    }
    const data = await window.api.importData();
    if (!data) return;
    if (data.error) { showToast('导入失败：文件格式不正确', 'error'); return; }
    const list = Array.isArray(data) ? data : (data.programs || []);
    if (!Array.isArray(list)) { showToast('导入失败：文件格式不正确', 'error'); return; }
    programs = list.map(p => ({
      id: cid(),
      name:         p.name || '',
      performer:    p.performer || '',
      bgColor:      p.bgColor || PALETTE[0],
      bgImagePath:  p.bgImagePath || null,
      audioPath:    p.audioPath || null,
      audioName:    p.audioName || ''
    }));
    currentId = programs.length ? programs[0].id : null;
    await persistData();
    loadCurrent();
    showToast(`已导入 ${programs.length} 个节目`);
  });

  // ---- Editor drawer ----
  function buildColorSwatches() {
    colorSet.innerHTML = '';
    PALETTE.forEach(c => {
      const sw = document.createElement('button');
      sw.className = 'swatch' + (c === pendingColor ? ' sel' : '');
      sw.style.background = c;
      sw.setAttribute('aria-label', `颜色 ${c}`);
      sw.addEventListener('click', () => { pendingColor = c; buildColorSwatches(); });
      colorSet.appendChild(sw);
    });
  }

  function openEditor(id) {
    editingId = id;
    const isNew = !id;
    drawerTitle.textContent = isNew ? '新增节目' : '编辑节目';
    deleteBtn.style.display = isNew ? 'none' : 'inline-block';
    const p = isNew ? null : programs.find(x => x.id === id);
    fName.value      = p ? p.name      : '';
    fPerformer.value = p ? p.performer : '';
    pendingColor      = p ? (p.bgColor || PALETTE[0]) : PALETTE[programs.length % PALETTE.length];
    pendingImagePath  = p ? p.bgImagePath : null;
    pendingImageName  = p && p.bgImagePath ? '已设置图片' : '';
    pendingAudioPath  = p ? p.audioPath   : null;
    pendingAudioName  = p ? (p.audioName || '') : '';
    imageName.textContent    = pendingImageName || '未选择';
    audioNameEl.textContent  = pendingAudioName || '未选择';
    fImage.value = '';
    fAudio.value = '';
    buildColorSwatches();
    drawerBackdrop.classList.add('active');
  }

  addBtn.addEventListener('click', () => openEditor(null));
  cancelBtn.addEventListener('click', () => drawerBackdrop.classList.remove('active'));
  drawerBackdrop.addEventListener('click', (e) => {
    if (e.target === drawerBackdrop) drawerBackdrop.classList.remove('active');
  });

  fImage.addEventListener('change', async () => {
    const file = fImage.files[0];
    if (!file) return;
    imageName.textContent = '复制中…';
    const result = await window.api.copyMedia(file.path);
    if (result.ok) {
      pendingImagePath = result.path;
      pendingImageName = file.name;
      imageName.textContent = file.name;
    } else {
      imageName.textContent = '复制失败';
      showToast('图片文件复制失败', 'error');
    }
    fImage.value = '';
  });

  fAudio.addEventListener('change', async () => {
    const file = fAudio.files[0];
    if (!file) return;
    audioNameEl.textContent = '复制中…';
    const result = await window.api.copyMedia(file.path);
    if (result.ok) {
      pendingAudioPath = result.path;
      pendingAudioName = file.name;
      audioNameEl.textContent = file.name;
    } else {
      audioNameEl.textContent = '复制失败';
      showToast('音频文件复制失败', 'error');
    }
    fAudio.value = '';
  });

  saveBtn.addEventListener('click', async () => {
    if (editingId) {
      const p = programs.find(x => x.id === editingId);
      p.name        = fName.value.trim();
      p.performer   = fPerformer.value.trim();
      p.bgColor     = pendingColor;
      p.bgImagePath = pendingImagePath;
      p.audioPath   = pendingAudioPath;
      p.audioName   = pendingAudioName;
    } else {
      const p = {
        id:          cid(),
        name:        fName.value.trim(),
        performer:   fPerformer.value.trim(),
        bgColor:     pendingColor,
        bgImagePath: pendingImagePath,
        audioPath:   pendingAudioPath,
        audioName:   pendingAudioName
      };
      programs.push(p);
      currentId = p.id;
    }
    drawerBackdrop.classList.remove('active');
    await persistData();
    loadCurrent();
  });

  deleteBtn.addEventListener('click', async () => {
    if (!editingId) return;
    const ok = await showConfirm('确定删除这个节目？');
    if (!ok) return;
    const idx = programs.findIndex(x => x.id === editingId);
    programs.splice(idx, 1);
    if (currentId === editingId) {
      currentId = programs.length ? programs[Math.min(idx, programs.length - 1)].id : null;
    }
    drawerBackdrop.classList.remove('active');
    await persistData();
    loadCurrent();
  });

  // ---- Init ----
  const [data, settings] = await Promise.all([
    window.api.getData(),
    window.api.getSettings()
  ]);
  programs = data.programs || [];
  currentId = programs.length ? programs[0].id : null;
  applySettings(settings);

  // Try to play welcome music
  if (settings.welcomeMusic) {
    window.addEventListener('load', () => {
      welcomeMusic.play().catch(() => {});
    });
  }

})();
</script>
</body>
</html>
